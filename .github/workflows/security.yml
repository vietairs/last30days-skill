name: Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    # Public fork: PRs from outside forks fall back to GitHub-hosted runners.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Blocking policy: the clean baseline run is confirmed, so dependency
      # CVEs fail CI instead of landing as advisory-only log output.
      - name: Export locked dependencies and run pip-audit
        run: bash .github/ci/dependency-audit.sh

  secret-scan:
    name: Secret scan
    # Public fork: PRs from outside forks fall back to GitHub-hosted runners.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    steps:
      - name: Checkout full history for diff-aware scanning
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Blocking policy: verified secrets block merges on pull requests and
      # pushes to main after the clean baseline was confirmed.
      # The script runs the pinned TruffleHog binary (the action needs Docker,
      # which the self-hosted Linux runner does not have).
      - name: Run TruffleHog OSS secret scan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: bash .github/ci/secret-scan.sh
